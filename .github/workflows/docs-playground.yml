name: Docs and public playground
on:
  push:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'examples/**'
      - 'playground/**'
      - '.devcontainer/**'
      - '.github/**'
      - 'scripts/check_docs.py'
      - 'main.py'
      - 'gits/**'
      - 'utils/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'examples/**'
      - 'playground/**'
      - '.devcontainer/**'
      - '.github/**'
      - 'scripts/check_docs.py'
      - 'main.py'
      - 'gits/**'
      - 'utils/**'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r playground/requirements.txt
      - run: python scripts/check_docs.py
      - run: python playground/test_demo.py
